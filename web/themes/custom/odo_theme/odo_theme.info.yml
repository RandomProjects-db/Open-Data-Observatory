name: 'ODO Theme'
type: theme
description: 'Open Data Observatory sub-theme of Olivero.'
package: 'Open Data Observatory'
core_version_requirement: ^11
base theme: olivero
libraries:
  - odo_theme/global
# Copied from Olivero: sub-themes do not inherit the base theme's regions.
regions:
  header: 'Header'
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  hero: 'Hero (full width)'
  highlighted: 'Highlighted'
  breadcrumb: 'Breadcrumb'
  social: 'Social Bar'
  content_above: 'Content Above'
  content: 'Content'
  sidebar: 'Sidebar'
  content_below: 'Content Below'
  footer_top: 'Footer Top'
  footer_bottom: 'Footer Bottom'
